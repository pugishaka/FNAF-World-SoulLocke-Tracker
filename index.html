<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FNAF World Soullocke Randomizer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>FNAF World Soullocke Randomizer</h1>

<main>

    <div class="game-area">

        <!-- SKULL COLUMN -->
        <div id="skullColumn" class="skull-column">
            <!-- Skulls are generated by JavaScript -->
        </div>


        <!-- CHARACTER COLUMNS -->
        <div id="columns" class="columns">

            <!-- COLUMN 1 -->
            <div class="column" data-column="1">

                <h2>
                    <input
                            class="column-name"
                            type="text"
                            value="Column 1"
                            maxlength="30"
                    >
                </h2>

                <div class="character-list">

                    <div class="character fixed">
                        Freddy
                    </div>

                    <div class="character fixed">
                        Bonnie
                    </div>

                    <div class="character fixed">
                        Chica
                    </div>

                    <div class="character fixed">
                        Foxy
                    </div>

                    <div class="character fixed">
                        Toy Freddy
                    </div>

                    <div class="character fixed">
                        Toy Bonnie
                    </div>

                    <div class="character fixed">
                        Toy Chica
                    </div>

                    <div class="character fixed">
                        Mangle
                    </div>

                </div>

                <button class="add-box">+</button>

            </div>


            <!-- COLUMN 2 -->
            <div class="column" data-column="2">

                <h2>
                    <input
                            class="column-name"
                            type="text"
                            value="Column 2"
                            maxlength="30"
                    >
                </h2>

                <div class="character-list"></div>

                <button class="add-box">+</button>

            </div>

    </div>


    <!-- COLUMN CONTROLS -->

    <div class="column-controls">

        <button id="addColumn">
            Add Third Column
        </button>

        <button id="removeColumn" class="hidden">
            Remove Third Column
        </button>

    </div>

</main>

<script src="script.js"></script>

</body>
</html>
